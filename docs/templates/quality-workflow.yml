name: Quality

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - run: python -m compileall -q pages liquidity_monitor scripts tests
      - run: python -m coverage run --branch --source=liquidity_monitor -m unittest discover -s tests -p 'test_*.py' -q
      - run: python -m coverage report --show-missing --fail-under=80
      - run: python -m ruff check liquidity_monitor scripts tests
      - run: python -m ruff check --select E9,F63,F7,F82 pages
